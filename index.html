    <style>
      /* ===== Animated gold shimmer border (hero card, buttons) ===== */
      @keyframes goldShimmer {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .gold-border-anim {
        position: relative;
        background-clip: padding-box;
      }
      .gold-border-anim::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(120deg, #D4AF37, #fff7c2, #D4AF37, #8a6a18, #D4AF37);
        background-size: 300% 300%;
        animation: goldShimmer 6s ease infinite;
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
                mask-composite: exclude;
        pointer-events: none;
      }

      /* ===== Shine sweep across element (buttons, badges) ===== */
      @keyframes shineSweep {
        0%   { transform: translateX(-120%) skewX(-20deg); }
        60%  { transform: translateX(220%)  skewX(-20deg); }
        100% { transform: translateX(220%)  skewX(-20deg); }
      }
      .shine-sweep { position: relative; overflow: hidden; }
      .shine-sweep::after {
        content: "";
        position: absolute;
        top: 0; bottom: 0; left: 0;
        width: 40%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
        animation: shineSweep 3.2s ease-in-out infinite;
        pointer-events: none;
      }

      /* ===== Card hover lift + glow ===== */
      .lift-on-hover {
        transition: transform 300ms cubic-bezier(.2,.7,.3,1.2),
                    box-shadow 300ms ease,
                    border-color 300ms ease;
      }
      .lift-on-hover:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 28px -10px rgba(212,175,55,0.35),
                    0 0 0 1px rgba(212,175,55,0.35) inset;
        border-color: rgba(212,175,55,0.55) !important;
      }

      /* ===== Animated progress bar fill ===== */
      @keyframes fillBar { from { width: 0; } }
      .bar-fill-anim { animation: fillBar 1100ms cubic-bezier(.2,.7,.3,1) both; }

      /* ===== Soft border pulse (verdict pill, accents) ===== */
      @keyframes borderPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(212,175,55,0.45); }
        50%      { box-shadow: 0 0 0 6px rgba(212,175,55,0); }
      }
      .border-pulse { animation: borderPulse 2.2s ease-in-out infinite; }

      /* ===== Conic rotating ring (around score circle) ===== */
      @keyframes spinSlow { to { transform: rotate(360deg); } }
      .ring-rotate {
        position: relative;
      }
      .ring-rotate::before {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: 9999px;
        background: conic-gradient(from 0deg, transparent 0 70%, #D4AF37 80%, transparent 90%);
        animation: spinSlow 6s linear infinite;
        z-index: -1;
        filter: blur(1px);
      }

      /* ===== Underline grow (tabs, links) ===== */
      .underline-grow { position: relative; }
      .underline-grow::after {
        content: "";
        position: absolute;
        left: 50%; bottom: -2px;
        height: 2px; width: 0;
        background: #D4AF37;
        transition: width 280ms ease, left 280ms ease;
      }
      .underline-grow:hover::after { width: 100%; left: 0; }

      /* ===== Icon wobble on card hover ===== */
      @keyframes wobble {
        0%,100% { transform: rotate(0); }
        25%     { transform: rotate(-8deg); }
        75%     { transform: rotate(8deg); }
      }
      .lift-on-hover:hover svg,
      .lift-on-hover:hover img { animation: wobble 600ms ease; }

      /* Respect reduced motion */
      @media (prefers-reduced-motion: reduce) {
        .gold-border-anim::before,
        .shine-sweep::after,
        .border-pulse,
        .ring-rotate::before,
        .bar-fill-anim { animation: none !important; }
      }
    </style>
