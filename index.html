    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script type="text/javascript">
      // Unregister any leftover service workers + nuke caches once on load
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(rs){
          rs.forEach(function(r){ r.unregister(); });
        });
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); });
      }
    </script>

    <style>
      /* ===== Global smooth scroll & momentum ===== */
      html { scroll-behavior: smooth; }
      body { -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
      * { -webkit-tap-highlight-color: transparent; }

      /* ===== Animated gold shimmer border (hero card, buttons) ===== */
      @keyframes goldShimmer {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .gold-border-anim {
        position: relative;
        background-clip: padding-box;
      }
      .gold-border-anim::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(120deg, #D4AF37, #fff7c2, #D4AF37, #8a6a18, #D4AF37);
        background-size: 300% 300%;
        animation: goldShimmer 6s ease infinite;
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
                mask-composite: exclude;
        pointer-events: none;
      }

      /* ===== Shine sweep across element (buttons, badges) ===== */
      @keyframes shineSweep {
        0%   { transform: translateX(-120%) skewX(-20deg); }
        60%  { transform: translateX(220%)  skewX(-20deg); }
        100% { transform: translateX(220%)  skewX(-20deg); }
      }
      .shine-sweep { position: relative; overflow: hidden; }
      .shine-sweep::after {
        content: "";
        position: absolute;
        top: 0; bottom: 0; left: 0;
        width: 40%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
        animation: shineSweep 3.2s ease-in-out infinite;
        pointer-events: none;
      }

      /* ===== Card hover lift + glow (desktop) / tap feedback (mobile) ===== */
      @keyframes wobble {
        0%,100% { transform: rotate(0); }
        25%     { transform: rotate(-8deg); }
        75%     { transform: rotate(8deg); }
      }
      .lift-on-hover {
        transition: transform 300ms cubic-bezier(.2,.7,.3,1.2),
                    box-shadow 300ms ease,
                    border-color 300ms ease,
                    background-color 300ms ease;
        will-change: transform;
      }
      @media (hover: hover) and (pointer: fine) {
        .lift-on-hover:hover {
          transform: translateY(-3px);
          box-shadow: 0 12px 28px -10px rgba(212,175,55,0.35),
                      0 0 0 1px rgba(212,175,55,0.35) inset;
          border-color: rgba(212,175,55,0.55) !important;
        }
        .lift-on-hover:hover svg,
        .lift-on-hover:hover img { animation: wobble 600ms ease; }
      }
      /* Touch devices: tap feedback (active state) */
      @media (hover: none) {
        .lift-on-hover:active {
          transform: scale(0.97);
          border-color: rgba(212,175,55,0.55) !important;
          box-shadow: 0 6px 16px -6px rgba(212,175,55,0.4);
        }
      }

      /* ===== Mobile-friendly breathing border (always-on) ===== */
      @keyframes breath {
        0%,100% { box-shadow: 0 0 0 0 rgba(212,175,55,0.0),
                              inset 0 0 0 1px rgba(212,175,55,0.10); }
        50%     { box-shadow: 0 0 18px -2px rgba(212,175,55,0.35),
                              inset 0 0 0 1px rgba(212,175,55,0.35); }
      }
      .breath { animation: breath 3.5s ease-in-out infinite; }

      /* ===== Scroll-reveal (works on touch — no :hover needed) ===== */
      @keyframes revealUp {
        from { opacity: 0; transform: translateY(24px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .reveal-on-scroll { opacity: 0; }
      .reveal-on-scroll.in-view {
        animation: revealUp 700ms cubic-bezier(.2,.7,.3,1) forwards;
      }

      /* Mobile gets a richer entrance: longer travel, blur lift, staggered
         children, smooth inertial scroll. */
      @media (max-width: 767px) {
        @keyframes revealUpMobile {
          from {
            opacity: 0;
            transform: translateY(40px) scale(.97);
            filter: blur(6px);
          }
          to {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
          }
        }
        .reveal-on-scroll.in-view {
          animation: revealUpMobile 800ms cubic-bezier(.16,.84,.3,1) forwards;
        }
        /* Stagger immediate children of a revealing section so the cards
           cascade in instead of popping all at once. */
        .reveal-on-scroll.in-view > * {
          animation: revealUpMobile 700ms cubic-bezier(.16,.84,.3,1) both;
        }
        .reveal-on-scroll.in-view > *:nth-child(1) { animation-delay: 60ms; }
        .reveal-on-scroll.in-view > *:nth-child(2) { animation-delay: 140ms; }
        .reveal-on-scroll.in-view > *:nth-child(3) { animation-delay: 220ms; }
        .reveal-on-scroll.in-view > *:nth-child(4) { animation-delay: 300ms; }
        .reveal-on-scroll.in-view > *:nth-child(5) { animation-delay: 380ms; }
        .reveal-on-scroll.in-view > *:nth-child(n+6) { animation-delay: 460ms; }

        /* Smooth inertial scrolling for the inner scroll container so
           section-to-section navigation feels native on touch. */
        html, body, .h-screen.overflow-y-scroll {
          scroll-behavior: smooth;
          -webkit-overflow-scrolling: touch;
        }

        /* Tap feedback: cards depress slightly when touched. */
        .reveal-on-scroll [class*="rounded"]:active {
          transform: scale(.98);
          transition: transform 120ms ease-out;
        }
      }

      /* ===== Floating drift (subtle, always-on) ===== */
      @keyframes float {
        0%,100% { transform: translateY(0); }
        50%     { transform: translateY(-4px); }
      }
      .float-y { animation: float 4s ease-in-out infinite; }

      /* ===== Progress bar fill (already used by guna bars) ===== */
      @keyframes fillBar { from { width: 0; } }
      .bar-fill-anim { animation: fillBar 1100ms cubic-bezier(.2,.7,.3,1) both; }

      /* ===== Soft border pulse (verdict pill, accents) ===== */
      @keyframes borderPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(212,175,55,0.45); }
        50%      { box-shadow: 0 0 0 6px rgba(212,175,55,0); }
      }
      .border-pulse { animation: borderPulse 2.2s ease-in-out infinite; }

      /* ===== Conic rotating ring (around score circle) ===== */
      @keyframes spinSlow { to { transform: rotate(360deg); } }
      .ring-rotate {
        position: relative;
      }
      .ring-rotate::before {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: 9999px;
        background: conic-gradient(from 0deg, transparent 0 70%, #D4AF37 80%, transparent 90%);
        animation: spinSlow 6s linear infinite;
        z-index: -1;
        filter: blur(1px);
      }

      /* ===== Underline grow (tabs, links) ===== */
      .underline-grow { position: relative; }
      .underline-grow::after {
        content: "";
        position: absolute;
        left: 50%; bottom: -2px;
        height: 2px; width: 0;
        background: #D4AF37;
        transition: width 280ms ease, left 280ms ease;
      }
      .underline-grow:hover::after { width: 100%; left: 0; }

      /* Icon wobble moved into the hover-media block above */

      /* Respect reduced motion */
      @media (prefers-reduced-motion: reduce) {
        .gold-border-anim::before,
        .shine-sweep::after,
        .border-pulse,
        .ring-rotate::before,
        .bar-fill-anim { animation: none !important; }
      }
    </style>

    <div id="root"></div>
    <script>
      // Scroll-reveal driver — proper IntersectionObserver edition.
      //
      // The React app renders inside an inner `overflow-y-scroll` container,
      // so an IntersectionObserver with the default (viewport) root never
      // fires as the user scrolls inside that container. The fix is to give
      // each observer the correct scrolling ancestor as its `root`, which is
      // exactly what the IntersectionObserver API was designed for.
      (function () {
        var observed = new WeakSet();
        var observersByRoot = new Map(); // root element (or null=viewport) -> IO

        function findScrollRoot(el) {
          var p = el.parentElement;
          while (p && p !== document.body && p !== document.documentElement) {
            var ov = getComputedStyle(p).overflowY;
            if ((ov === 'auto' || ov === 'scroll') && p.scrollHeight > p.clientHeight) {
              return p;
            }
            p = p.parentElement;
          }
          return null; // viewport
        }

        function getObserver(root) {
          var key = root || 'viewport';
          if (observersByRoot.has(key)) return observersByRoot.get(key);
          var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
              if (!entry.isIntersecting) return;
              entry.target.classList.add('in-view');
              entry.target.classList.add('revealed');
              io.unobserve(entry.target);
            });
          }, {
            root: root,
            threshold: 0.12,
            rootMargin: '0px 0px -8% 0px'
          });
          observersByRoot.set(key, io);
          return io;
        }

        function scan() {
          var els = document.querySelectorAll('.reveal-on-scroll');
          for (var i = 0; i < els.length; i++) {
            var el = els[i];
            if (observed.has(el)) continue;
            observed.add(el);
            getObserver(findScrollRoot(el)).observe(el);
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', scan);
        } else {
          scan();
        }

        // React mounts content asynchronously — re-scan as nodes appear.
        new MutationObserver(scan).observe(document.body, {
          childList: true,
          subtree: true
        });
      })();
    </script>
  </body>
